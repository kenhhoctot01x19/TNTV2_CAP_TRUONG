.image-option-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;align-items:stretch;margin:14px 0}

/* ===== Tối ưu khả năng đọc cho học sinh lớp 1 ===== */
body{font-size:19px;line-height:1.55}

/* ===== Bổ sung tương tác kéo thả từ vào chỗ trống cho Câu 30 ===== */
.dragfill-list{display:grid;gap:13px;margin:14px 0}

let state={idx:0,order:[],answers:{},shuffle:false,remaining:1800,timer:null,selected:null};
let dragged=null,draggedGroup=null,matchDrag=null,dragFillItem=null;
const $=id=>document.getElementById(id);

const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const shuffleArray=arr=>[...arr].sort(()=>Math.random()-.5);
function A(q){return state.answers[q.id]||(state.answers[q.id]={});}
function current(){return QUESTIONS.find(q=>q.id===state.order[state.idx]);}
function startGame(ordered){
  state.shuffle=$('shuffleAnswers').checked;
  state.order=QUESTIONS.map(q=>q.id);
  if(!ordered&&$('shuffleQuestions').checked)state.order=shuffleArray(state.order);
  QUESTIONS.forEach(q=>{
    delete q._opts;delete q._imageOptions;delete q._right;delete q._items;
    if(state.shuffle){
      if(q.options)q._opts=shuffleArray(q.options);
      if(q.imageOptions)q._imageOptions=shuffleArray(q.imageOptions);
      if(q.right)q._right=shuffleArray(q.right);
      if(q.type==='group'||q.type==='dragfill')q._items=shuffleArray(q.items);
      if(q.type==='order')q._items=shuffleArray(q.items);
    }
  });
  state.idx=0;state.answers={};state.selected=null;state.remaining=$('timerOn').checked?1800:0;
  $('startScreen').hidden=true;$('gameScreen').hidden=false;
  const brand=document.querySelector('.brand');if(brand)brand.hidden=true;
  $('timer').textContent='30:00';render();if(state.remaining)tick();
}
function tick(){clearInterval(state.timer);state.timer=setInterval(()=>{
  state.remaining--;let m=Math.floor(state.remaining/60),s=state.remaining%60;
  $('timer').textContent=String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');
  if(state.remaining<=0){clearInterval(state.timer);submitGame(true);}
},1000)}
function renderInlinePrompt(q,a){
  return q.inlinePrompt.replace(/\[\[(\d+)\]\]/g,(_,n)=>{
    const i=Number(n),v=a.fields?.[i]??'';
    return `<input class="inline-input" aria-label="Chỗ trống ${i+1}" value="${esc(v)}" placeholder="……" ${a.checked?'disabled':''} oninput="setInline(${i},this.value)">`;
  });
}
function renderDragFillPrompt(q,a){
  return q.inlinePrompt.replace(/\[\[([a-z0-9_]+)\]\]/gi,(_,sid)=>{
    const id=a.dragfills?.[sid],item=(q._items||q.items).find(x=>x[0]===id);
    return `<span class="dragfill-slot ${id?'filled':''}" data-slot="${sid}" ondragover="allowDrop(event)" ondrop="dropFillTo(event,'${sid}')" onclick="tapFillSlot('${sid}')">${id?`<span class="dragfill-chip">${esc(item?.[1]||'')}</span>`:'……'}</span>`;
  });
}
function setInline(i,value){let q=current(),a=A(q);if(a.checked)return;a.fields=a.fields||{};a.fields[i]=value;}
function matchContent(q,side,id,label){
  const key=q.matchImages?.[side]?.[id];
  return key?`<img class="match-image" draggable="false" src="${IMG[key]}" alt="${esc(label)}">`:`<span>${esc(label)}</span>`;
}
function render(){
  const q=current(),a=A(q),total=QUESTIONS.length;
  $('progressText').textContent=Object.values(state.answers).filter(x=>x.checked).length+'/'+total;
  $('progressBar').style.width=((state.idx+1)/total*100)+'%';

  }else{
    if(q.inlinePrompt&&q.prompt)prompt=q.prompt+'<br><br>'+prompt;

    const opts=q._opts||q.options;

  }

  }
  if(q.type==='fill'&&!q.inlinePrompt)h+=`<div class="answer-line"><label class="field-label">Đáp án của em</label><input class="text-input" id="fillAnswer" value="${esc(a.value||'')}" placeholder="${esc(q.placeholder||'Nhập đáp án')}" ${a.checked?'disabled':''} oninput="A(current()).value=this.value"></div>`;
  if(q.type==='fields'&&!q.inlinePrompt)h+=`<div class="subpart-list">${q.fields.map((f,i)=>`<div class="answer-line"><label class="field-label">${esc(f)}</label><input class="text-input" value="${esc(a.fields?.[i]||'')}" ${a.checked?'disabled':''} oninput="A(current()).fields=A(current()).fields||{};A(current()).fields[${i}]=this.value"></div>`).join('')}</div>`;
  if(q.type==='match'){
    const right=q._right||q.right;
    h+=`<div class="match-help">Kéo từ cạnh ô bên trái sang ô tương ứng bên phải để nối. Em cũng có thể chạm ô bên trái rồi chạm ô bên phải. Muốn đổi, hãy nối lại.</div>
    <div class="match-board" id="matchBoard"><div class="match-col">${q.left.map(([id,t])=>`<div class="match-card ${a.matches?.[id]?'matched':''} ${state.selected===id?'selected':''}" data-side="left" data-id="${id}" onpointerdown="beginMatchDrag(event,'${id}')" onclick="pickLeft('${id}')">${matchContent(q,'left',id,t)}</div>`).join('')}</div>
    <svg class="match-svg" id="matchSvg" aria-hidden="true"></svg>
    <div class="match-col">${right.map(([id,t])=>`<div class="match-card ${Object.values(a.matches||{}).includes(id)?'matched':''}" data-side="right" data-id="${id}" onclick="pickRight('${id}')">${matchContent(q,'right',id,t)}</div>`).join('')}</div></div>
    <div class="help">Đã nối: ${Object.keys(a.matches||{}).length}/${q.left.length}</div>`;
  }
  if(q.type==='group'){
    const items=q._items||q.items;
    h+=`<div class="help">Kéo thẻ từ vào nhóm phù hợp. Có thể kéo thẻ về khu vực từ cho sẵn để xếp lại. Trên điện thoại, chạm thẻ rồi chạm nhóm; chạm thẻ đã xếp để trả về.</div>
    <div class="group-bank" data-group-bank ondragover="allowDrop(event)" ondrop="dropGroupToBank(event)">${items.filter(([id])=>!a.groups?.[id]).map(([id,t])=>`<span class="chip ${state.selected===id?'selected':''}" draggable="true" ondragstart="dragGroup(event,'${id}')" onclick="pickGroup('${id}')">${esc(t)}</span>`).join('')||'<span class="muted">Đã xếp hết các từ.</span>'}</div>
    <div class="group-grid">${q.groups.map(([gid,label])=>`<div class="dropzone" data-gid="${gid}" ondragover="allowDrop(event)" ondrop="dropGroupTo(event,'${gid}')" onclick="placeGroup('${gid}')"><h4>${esc(label)}</h4>${items.filter(([id])=>a.groups?.[id]===gid).map(([id,t])=>`<span class="chip" draggable="true" ondragstart="dragGroup(event,'${id}')" onclick="event.stopPropagation();returnGroup('${id}')">${esc(t)}</span>`).join('')}</div>`).join('')}</div>`;
  }
  if(q.type==='order'){
    const items=q._items||q.items;if(!a.order)a.order=items.map(x=>x[0]);const arr=a.order;
    h+=`<div class="help">Kéo thẻ để sắp xếp. Trên điện thoại, chạm hai thẻ liên tiếp để đổi vị trí.</div><div class="order-list">${arr.map(id=>{const it=items.find(x=>x[0]===id)||q.items.find(x=>x[0]===id);return `<span class="order-item ${it?.[2]?'image-order-item':''} ${state.selected===id?'selected':''}" draggable="true" ondragstart="dragOrder(event,'${id}')" ondragover="event.preventDefault()" ondrop="dropOrder(event,'${id}')" onclick="tapOrder('${id}')">${it?.[2]?`<img class="order-image" src="${IMG[it[2]]}" alt="${esc(it[1])}">`:esc(it?.[1]||'')}</span>`}).join('')}</div>`;
  }
  if(q.type==='dragfill'){
    const items=q._items||q.items;
    h+=`<div class="help">Kéo từ ở ngân hàng từ vào chỗ trống tương ứng. Trên điện thoại, chạm một thẻ từ rồi chạm vào ô trống. Chạm từ đã điền để đưa trở lại ngân hàng.</div>`;
    if(!q.inlinePrompt){
      h+=`<div class="dragfill-list">${q.slots.map(([sid,label])=>`<div class="dragfill-row"><span>${esc(label)}</span><span class="dragfill-slot ${a.dragfills?.[sid]?'filled':''}" data-slot="${sid}" ondragover="allowDrop(event)" ondrop="dropFillTo(event,'${sid}')" onclick="tapFillSlot('${sid}')">${a.dragfills?.[sid]?`<span class="dragfill-chip">${esc(items.find(x=>x[0]===a.dragfills[sid])?.[1]||'')}</span>`:'……'}</span>.</div>`).join('')}</div>`;
    }
    h+=`<div class="dragfill-bank" ondragover="allowDrop(event)" ondrop="dropFillToBank(event)">${items.filter(([id])=>!Object.values(a.dragfills||{}).includes(id)).map(([id,t])=>`<span class="dragfill-chip ${state.selected===id?'selected':''}" draggable="true" ondragstart="dragFill(event,'${id}')" onclick="pickFill('${id}')">${esc(t)}</span>`).join('')}</div>`;
  }
  $('questionContent').innerHTML=h;$('feedback').innerHTML=a.checked?feedback(q):'';
  $('checkBtn').disabled=!!a.checked;$('checkBtn').textContent=a.checked?'ĐÃ KIỂM TRA':'✓ KIỂM TRA ĐÁP ÁN';
  $('prevBtn').disabled=state.idx===0;$('nextBtn').disabled=state.idx===total-1;
  if(q.type==='match')requestAnimationFrame(()=>drawLines(q));
}
function choose(id,multi){let a=A(current());if(a.checked)return;if(multi){a.choice=a.choice||[];a.choice=a.choice.includes(id)?a.choice.filter(x=>x!==id):[...a.choice,id];}else a.choice=id;render();}
function pickLeft(id){if(A(current()).checked)return;state.selected=id;render();}
function pickRight(id){let q=current(),a=A(q);if(a.checked||!state.selected)return;connectMatch(state.selected,id);}
function connectMatch(leftId,rightId){let q=current(),a=A(q);if(a.checked)return;a.matches=a.matches||{};for(const k in a.matches)if(k===leftId||a.matches[k]===rightId)delete a.matches[k];a.matches[leftId]=rightId;state.selected=null;matchDrag=null;render();}
function beginMatchDrag(e,id){if(A(current()).checked)return;matchDrag={id};state.selected=id;}
function drawLines(q){
  const svg=$('matchSvg'),board=$('matchBoard');if(!svg||!board)return;
  const b=board.getBoundingClientRect();svg.setAttribute('viewBox',`0 0 ${b.width} ${b.height}`);svg.innerHTML='';
  const left=board.querySelectorAll('.match-card[data-side="left"]'),right=board.querySelectorAll('.match-card[data-side="right"]');
  const a=A(q);
  Object.entries(a.matches||{}).forEach(([lid,rid])=>{
    const l=[...left].find(el=>el.dataset.id===lid),r=[...right].find(el=>el.dataset.id===rid);if(!l||!r)return;
    const lr=l.getBoundingClientRect(),rr=r.getBoundingClientRect();
    const line=document.createElementNS('http://www.w3.org/2000/svg','line');
    line.setAttribute('x1',lr.right-b.left);line.setAttribute('y1',lr.top+lr.height/2-b.top);
    line.setAttribute('x2',rr.left-b.left);line.setAttribute('y2',rr.top+rr.height/2-b.top);svg.appendChild(line);
  });
}
function drawTempLine(x,y){
  if(!matchDrag)return;const svg=$('matchSvg'),board=$('matchBoard');if(!svg||!board)return;
  const card=board.querySelector(`.match-card[data-side="left"][data-id="${matchDrag.id}"]`);if(!card)return;
  const b=board.getBoundingClientRect(),r=card.getBoundingClientRect();
  let line=svg.querySelector('.temp-line');if(!line){line=document.createElementNS('http://www.w3.org/2000/svg','line');line.setAttribute('class','temp-line');svg.appendChild(line);}
  line.setAttribute('x1',r.right-b.left);line.setAttribute('y1',r.top+r.height/2-b.top);line.setAttribute('x2',x-b.left);line.setAttribute('y2',y-b.top);
}
document.addEventListener('pointermove',e=>{if(matchDrag)drawTempLine(e.clientX,e.clientY);});
document.addEventListener('pointerup',e=>{
  if(!matchDrag)return;
  const target=document.elementFromPoint(e.clientX,e.clientY)?.closest('.match-card[data-side="right"]');
  if(target&&$('matchBoard')?.contains(target)){connectMatch(matchDrag.id,target.dataset.id);return;}
  matchDrag=null;const q=current();if(q?.type==='match'&&!$('gameScreen').hidden)requestAnimationFrame(()=>drawLines(q));
});
function pickGroup(id){if(A(current()).checked)return;state.selected=id;render();}
function placeGroup(gid){let q=current(),a=A(q);if(!state.selected||a.checked)return;a.groups=a.groups||{};a.groups[state.selected]=gid;state.selected=null;render();}
function returnGroup(id){let a=A(current());if(a.checked)return;delete a.groups?.[id];state.selected=null;render();}
function allowDrop(e){e.preventDefault();}
function dragGroup(e,id){if(A(current()).checked){e.preventDefault();return;}draggedGroup=id;e.dataTransfer.setData('text/plain',id);e.dataTransfer.effectAllowed='move';}
function dropGroupTo(e,gid){e.preventDefault();let a=A(current()),id=draggedGroup||state.selected;if(!id||a.checked)return;a.groups=a.groups||{};a.groups[id]=gid;draggedGroup=null;state.selected=null;render();}
function dropGroupToBank(e){e.preventDefault();let a=A(current()),id=draggedGroup||state.selected;if(!id||a.checked)return;if(a.groups)delete a.groups[id];draggedGroup=null;state.selected=null;render();}
function tapOrder(id){if(A(current()).checked)return;if(!state.selected){state.selected=id;render();return;}let q=current(),a=A(q),items=q._items||q.items,arr=a.order||items.map(x=>x[0]),i=arr.indexOf(state.selected),j=arr.indexOf(id);if(i>=0&&j>=0)[arr[i],arr[j]]=[arr[j],arr[i]];a.order=arr;state.selected=null;render();}
function dragOrder(e,id){if(A(current()).checked){e.preventDefault();return;}dragged=id;e.dataTransfer.setData('text/plain',id);}
function dropOrder(e,id){e.preventDefault();let q=current(),a=A(q),items=q._items||q.items,arr=a.order||items.map(x=>x[0]),from=arr.indexOf(dragged),to=arr.indexOf(id);if(from>=0&&to>=0){arr.splice(to,0,arr.splice(from,1)[0]);a.order=arr;}dragged=null;render();}
function pickFill(id){if(A(current()).checked)return;state.selected=id;render();}
function dragFill(e,id){if(A(current()).checked){e.preventDefault();return;}dragFillItem=id;e.dataTransfer.setData('text/plain',id);e.dataTransfer.effectAllowed='move';}
function placeFill(slotId){let q=current(),a=A(q),id=dragFillItem||state.selected;if(!id||a.checked)return;a.dragfills=a.dragfills||{};for(const k of Object.keys(a.dragfills))if(a.dragfills[k]===id)delete a.dragfills[k];a.dragfills[slotId]=id;dragFillItem=null;state.selected=null;render();}
function tapFillSlot(slotId){let a=A(current());if(a.checked)return;if(state.selected){placeFill(slotId);return;}if(a.dragfills)delete a.dragfills[slotId];render();}
function dropFillTo(e,slotId){e.preventDefault();placeFill(slotId);}
function dropFillToBank(e){e.preventDefault();let q=current(),a=A(q),id=dragFillItem||state.selected;if(!id||a.checked)return;for(const k of Object.keys(a.dragfills||{}))if(a.dragfills[k]===id)delete a.dragfills[k];dragFillItem=null;state.selected=null;render();}
function calc(q,a){
  if(q.manualReview)return null;
  if(q.type==='mcq'||q.type==='mcq-image'||q.type==='select')return a.choice===q.correct?10:0;
  if(q.type==='multi')return JSON.stringify([...(a.choice||[])].sort())===JSON.stringify([...q.correct].sort())?10:0;
  if(q.type==='fill'){
    const vals=q.correct||[];
    if(q.inlinePrompt)return vals.some((x,i)=>norm(x)===norm(a.fields?.[i]))?10:0;
    return vals.some(x=>norm(x)===norm(a.value))?10:0;
  }
  if(q.type==='fields')return q.correct.reduce((sum,x,i)=>sum+(norm(x)===norm(a.fields?.[i])?10/q.correct.length:0),0);
  if(q.type==='match'){let n=Object.keys(q.correct).length,h=Object.entries(q.correct).filter(([k,v])=>a.matches?.[k]===v).length;return n?h/n*10:0;}
  if(q.type==='group'){const items=q.items||[];const n=items.length;if(!n)return 0;const h=items.filter(([id])=>Object.prototype.hasOwnProperty.call(q.correct,id)&&a.groups?.[id]===q.correct[id]).length;return Math.min(10,Math.max(0,h/n*10));}
  if(q.type==='order'){let arr=a.order||q.items.map(x=>x[0]);return q.correct.reduce((sum,x,i)=>sum+(arr[i]===x?10/q.correct.length:0),0);}
  if(q.type==='dragfill'){const n=q.slots.length;const h=q.slots.filter(([id])=>a.dragfills?.[id]===q.correct[id]).length;return n?h/n*10:0;}
  return 0;
}
function answerText(q){
  if(q.manualReview)return 'Không có nội dung câu hỏi trong PDF đề gốc; chờ giáo viên bổ sung.';
  if(q.type==='mcq'||q.type==='select')return q.options.find(x=>x[0]===q.correct)?.[1]||q.correct;
  if(q.type==='mcq-image')return q.imageOptions.find(x=>x[0]===q.correct)?.[1]||q.correct;
  if(q.type==='multi')return q.correct.map(id=>q.options.find(x=>x[0]===id)?.[1]||id).join(', ');
  if(q.type==='fill')return q.correct.join(' / ');
  if(q.type==='fields')return q.correct.join(' – ');
  if(q.type==='match')return Object.entries(q.correct).map(([k,v])=>q.left.find(x=>x[0]===k)[1]+' → '+q.right.find(x=>x[0]===v)[1]).join('; ');
  if(q.type==='group')return Object.entries(q.correct).map(([k,v])=>q.items.find(x=>x[0]===k)[1]+' → '+q.groups.find(x=>x[0]===v)[1]).join('; ');
  if(q.type==='order')return q.correct.map(id=>q.items.find(x=>x[0]===id)[1]).join(' → ');
  if(q.type==='dragfill')return q.slots.map(([id,label])=>label+': '+q.items.find(x=>x[0]===q.correct[id])[1]).join('; ');
  return '';
}
function reviewPrompt(q){const s=q.inlinePrompt?(String(q.prompt||'')+' '+String(q.inlinePrompt||'')):String(q.prompt||'');return s.replace(/<br\s*\/?\s*>/gi,' ').replace(/\[\[[^\]]+\]\]/g,'………');}
function feedback(q){let a=A(q),p=calc(q,a);if(p===null)return `<div class="feedback wrong"><b>Cần giáo viên xác nhận.</b> Câu này chưa được tính điểm tự động. ${esc(q.reviewNote||'')}</div>`;return `<div class="feedback ${p>=9.99?'':'wrong'}"><b>${p>=9.99?'Chính xác!':'Em đã hoàn thành lượt kiểm tra.'}</b> Điểm câu này: ${p.toFixed(1).replace('.0','')}/10. ${q.explanation||''} ${p<9.99?'<br><b>Đáp án:</b> '+esc(answerText(q)):''}</div>`;}
function checkAnswer(){
  let q=current(),a=A(q);if(a.checked)return;
  if(q.manualReview){a.checked=true;state.selected=null;render();return;}
  if((q.type==='mcq'||q.type==='mcq-image'||q.type==='select')&&!a.choice){alert('Em hãy chọn đáp án!');return;}
  if(q.type==='multi'&&!a.choice?.length){alert('Em hãy chọn đáp án!');return;}
  if(q.type==='fill'){
    const vals=q.inlinePrompt?Object.values(a.fields||{}):[a.value||''];
    if(!vals.some(v=>String(v).trim())){alert('Em hãy điền đáp án vào chỗ trống!');return;}
  }
  if(q.type==='fields'&&q.correct.some((_,i)=>!a.fields?.[i]?.trim())){alert('Em hãy điền đủ các chỗ trống!');return;}
  if(q.type==='match'&&Object.keys(a.matches||{}).length===0){alert('Em hãy nối các cặp tương ứng!');return;}
  if(q.type==='group'&&Object.keys(a.groups||{}).length===0){alert('Em hãy xếp các từ vào nhóm!');return;}
  if(q.type==='order'&&(a.order||[]).length===0){alert('Em hãy sắp xếp các thẻ!');return;}
  if(q.type==='dragfill'&&q.slots.some(([id])=>!a.dragfills?.[id])){alert('Em hãy điền đủ các chỗ trống!');return;}
  a.checked=true;state.selected=null;render();
}
function move(d){state.idx=Math.max(0,Math.min(QUESTIONS.length-1,state.idx+d));state.selected=null;matchDrag=null;dragFillItem=null;render();}
function go(i){state.idx=i;state.selected=null;matchDrag=null;dragFillItem=null;render();}
function submitGame(auto=false){
  if(!$('gameScreen').hidden&&!auto&&!confirm('Em có chắc chắn muốn nộp bài?'))return;
  clearInterval(state.timer);let total=0,full=0,part=0,wrong=0,pending=0;
  QUESTIONS.forEach(q=>{let p=calc(q,A(q));if(p===null){pending++;return;}total+=p;if(p>=9.99)full++;else if(p>0)part++;else wrong++;});
  $('gameScreen').hidden=true;$('resultScreen').hidden=false;
  $('resultBody').innerHTML=`<div class="result-score">${total.toFixed(1).replace('.0','')} / 300 điểm</div><p>Điểm trên đây là tổng điểm tự động của bài làm.</p><p>Đúng hoàn toàn: <b>${full}</b> câu</p><p>Đúng một phần: <b>${part}</b> câu</p><p>Sai hoặc chưa hoàn thành: <b>${wrong}</b> câu</p><p>Câu cần giáo viên xác nhận: <b>${pending}</b> câu (chưa cộng vào điểm tạm tính)</p><p>Thời gian còn lại: ${$('timer').textContent}</p><hr><h3>Xem lại đáp án</h3>${QUESTIONS.map(q=>{let p=calc(q,A(q));return `<div class="feedback ${p!==null&&p>=9.99?'':'wrong'}"><b>Câu ${q.id} – ${p===null?'Chờ xác nhận':p.toFixed(1).replace('.0','')+'/10'}</b><br>${esc(reviewPrompt(q))}<br><b>Đáp án:</b> ${esc(answerText(q))}${q.manualReview?'<br><b>Ghi chú:</b> '+esc(q.reviewNote):''}</div>`}).join('')}<div class="action-row"><button class="btn primary" onclick="location.reload()">LÀM LẠI BÀI</button></div>`;
}
$('questionContent').addEventListener('click',e=>{
  const zone=e.target.closest('.dropzone');if(zone&&!e.target.closest('.chip')){placeGroup(zone.dataset.gid);return;}
});
window.addEventListener('resize',()=>{let q=current();if(q?.type==='match'&&!$('gameScreen').hidden)requestAnimationFrame(()=>drawLines(q));});
</script></body></html>
